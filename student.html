<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂簽到簿｜學生報到</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">✓</div>
      <div>
        <div class="brand-title" id="appName">課堂簽到簿</div>
        <div class="brand-sub" id="appSub">QR Code 點名與課堂互動</div>
      </div>
    </div>
    <span class="pill pill-muted" id="statusPill">檢查中…</span>
  </div>
</header>

<div class="container">
  <nav class="tabs">
    <a href="index.html">老師管理</a>
    <a class="active" href="student.html">學生報到</a>
  </nav>

  <section id="formView" class="card center">
    <div class="eyebrow">學生報到</div>
    <h2>完成本週簽到</h2>
    <p class="meta" id="sessionInfo">掃描 QR Code 後，輸入學號與姓名即可。</p>
    <div id="formError" class="alert alert-error" hidden></div>

    <label>課堂代碼</label>
    <input id="code" type="text" placeholder="請輸入老師提供的代碼" autocomplete="off" autocapitalize="characters">
    <label>學號</label>
    <input id="studentId" type="text" placeholder="例如 S112001" autocomplete="off" autocapitalize="characters">
    <label>姓名</label>
    <input id="name" type="text" placeholder="請輸入姓名" autocomplete="name">
    <div style="margin-top:18px">
      <button class="btn btn-primary btn-block" id="submitBtn">完成簽到</button>
    </div>
    <p class="help">學號與姓名只會用於本課程點名。同一週每個學號只能簽到一次。</p>
  </section>

  <section id="successView" class="card center" hidden>
    <div class="big-check">✅</div>
    <h2 style="text-align:center">簽到成功</h2>
    <p class="meta" style="text-align:center">你的報到時間已記錄。</p>
    <div class="alert alert-success" id="successInfo"></div>
  </section>

  <p class="footer">課堂簽到簿 · 靜態網頁 + Firebase Firestore</p>
</div>

<script type="module">
import { firebaseConfig, APP_NAME, APP_SUBTITLE } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, query, where, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
document.title = `${APP_NAME}｜學生報到`;
$("appName").textContent = APP_NAME;
$("appSub").textContent = APP_SUBTITLE;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function showError(msg) { const el = $("formError"); el.textContent = msg || ""; el.hidden = !msg; }
function setPill(text, cls) { $("statusPill").textContent = text; $("statusPill").className = "pill " + cls; }

// 由 QR Code 連結帶入代碼
const params = new URLSearchParams(location.search);
if (params.get("code")) $("code").value = params.get("code").trim().toUpperCase();

// 記住上次輸入的學號姓名（僅存在本機瀏覽器）
try {
  $("studentId").value = localStorage.getItem("checkin.studentId") || "";
  $("name").value = localStorage.getItem("checkin.name") || "";
} catch (_) {}

// 匿名登入（Firestore 規則需要 request.auth）
let authReady = new Promise((resolve) => {
  onAuthStateChanged(auth, (user) => { if (user) resolve(user); });
});
signInAnonymously(auth).catch(err => { showError("無法連線至簽到系統：" + err.message); setPill("連線失敗", "pill-closed"); });

// 查詢代碼對應的週次
let session = null;
async function lookupSession(code) {
  const snap = await getDocs(query(collection(db, "sessions"), where("code", "==", code), limit(1)));
  return snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
}
async function refreshSession() {
  const code = $("code").value.trim().toUpperCase();
  session = null;
  if (!code) { setPill("請輸入代碼", "pill-muted"); $("sessionInfo").textContent = "掃描 QR Code 後，輸入學號與姓名即可。"; return; }
  try {
    await authReady;
    session = await lookupSession(code);
    if (!session) { setPill("代碼不存在", "pill-closed"); $("sessionInfo").textContent = "找不到此課堂代碼，請確認是否輸入正確。"; return; }
    $("sessionInfo").textContent = `${session.courseName}・第 ${session.sessionNumber} 週・${session.classDate} ${session.startTime}–${session.endTime}`;
    if (session.status === "open") setPill("簽到開放中", "pill-open"); else setPill("本週已關閉", "pill-closed");
  } catch (err) { showError("無法讀取資料：" + err.message); }
}
$("code").addEventListener("change", refreshSession);
refreshSession();

// 送出簽到
$("submitBtn").onclick = async () => {
  showError("");
  const code = $("code").value.trim().toUpperCase();
  const studentId = $("studentId").value.trim().toUpperCase();
  const name = $("name").value.trim();
  if (!code || !studentId || !name) { showError("缺少課堂代碼、學號或姓名。"); return; }
  if (!/^[A-Z0-9\-]{3,20}$/.test(studentId)) { showError("學號格式不正確（僅限英數字，3–20 字元）。"); return; }
  $("submitBtn").disabled = true; $("submitBtn").textContent = "簽到中…";
  try {
    const user = await authReady;
    if (!session || session.code !== code) session = await lookupSession(code);
    if (!session) throw new Error("找不到此課堂代碼。");
    if (session.status !== "open") throw new Error("本週簽到已關閉，請聯絡老師。");
    // 文件 id = 週次id_學號 → 同一週同一學號只能簽到一次（規則只允許 create）
    const ref = doc(db, "attendees", `${session.id}_${studentId}`);
    await setDoc(ref, {
      sessionId: session.id, sessionCode: code, studentId, name,
      questions: 0, uid: user.uid, checkedInAt: serverTimestamp()
    });
    try { localStorage.setItem("checkin.studentId", studentId); localStorage.setItem("checkin.name", name); } catch (_) {}
    $("successInfo").textContent = `${name}（${studentId}）已完成 ${session.courseName} 第 ${session.sessionNumber} 週簽到。`;
    $("formView").hidden = true; $("successView").hidden = false;
  } catch (err) {
    const msg = err.code === "permission-denied"
      ? "簽到失敗：此學號本週已簽到過，或本週簽到已關閉。"
      : "簽到失敗：" + err.message;
    showError(msg);
  } finally { $("submitBtn").disabled = false; $("submitBtn").textContent = "完成簽到"; }
};
$("name").addEventListener("keydown", (e) => { if (e.key === "Enter") $("submitBtn").click(); });
</script>
</body>
</html>
